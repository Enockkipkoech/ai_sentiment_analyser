[project]
name = "sentiment-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Enockkipkoech", email = "enockkipkoech19@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.34.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
